<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">

        <img 
            src="https://picsum.photos/600/400" 
            alt="تصویر محصول"
            class="card-image"
        >

        <div class="card-content">

            <span class="card-category">Programming</span>

            <h2>یادگیری JavaScript</h2>

            <p>
                با یادگیری JavaScript می‌توانید صفحات وب
                تعاملی و مدرن طراحی کنید.
            </p>

            <div class="card-footer">
                <span class="price">$49</span>

                <button>مشاهده دوره</button>
            </div>

        </div>

    </div>

</body>
</html>
